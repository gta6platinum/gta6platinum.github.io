طة اللاعودة هي مهمة Checking Out — بعدها Starlet Motel يقفل وفيه كرتين يفوتون. خلّص القائمة كلها قبلها.","Chapter 3 opens Vice City and the big car-theft tools. One stranger mission here is timed — don't leave it for later.":"الفصل 3 يفتح لك Vice City وأدوات سرقة السيارات الكبيرة. فيه مهمة غرباء محدودة بوقت — لا تأجلها.","Chapter 4 adds a free garage and more of Vice City. Nothing confirmed missable yet — keep a manual save at the start.":"الفصل 4 يعطيك كراج مجاني وجزء أكبر من Vice City. للحين ما فيه شي مؤكد إنه يفوت — خلّ عندك حفظ يدوي ببدايته.","Chapter 5 is the last chapter. Your ending may limit who you can play afterwards — finish every side strand and character questline before the final mission.":"الفصل 5 آخر فصل. النهاية ممكن تحدد مين تقدر تلعب فيه بعدها — خلّص كل مهام الغرباء ومهام الشخصيات قبل المهمة الأخيرة.","Make a manual save":"سوّ حفظ يدوي","Keep one save in Chapter 1 that you never overwrite.":"خلّ حفظ واحد بالفصل 1 لا تكتب عليه أبد.","Balcony meditation with Lucia ⚠️ MISSABLE":"تأمّل البلكونة مع Lucia ⚠️ يفوت","After Down to Earth, talk to Lucia inside Jason's house until she goes to meditate on the balcony, then accept. Gone after Chapter 1.":"بعد Down to Earth كلّم Lucia داخل بيت Jason لين تروح تتأمل بالبلكونة، واقبل. يروح بعد الفصل 1.","Repair Jason's house ⚠️ MISSABLE":"صلّح بيت Jason ⚠️ يفوت","Do the optional repairs at Jason's house (tools are already there) before picking up Lucia in Coming Home.":"سوّ التصليحات الاختيارية ببيت Jason (الأدوات موجودة) قبل ما تجيب Lucia بمهمة Coming Home.","Lab Fees codes":"أكواد Lab Fees","Moonstone Boutique back room 0420 · Brian's Lockup 7700.":"الغرفة الخلفية في Moonstone Boutique ‏0420 · Brian's Lockup ‏7700.","Kenton's underwater treasure":"كنوز Kenton تحت الماء","Kenton unlocks after Island Dreams and pauses after Chapter 1 — dive his shipwrecks now if you can.":"Kenton ينفتح بعد Island Dreams ويوقف بعد الفصل 1 — غُص على سفنه الحين إذا تقدر.","Grab the free legendary weapons":"خذ الأسلحة الأسطورية المجانية","Hunter's Laird 350 at the Grassrivers junction and the Keys pickups are available from the start — see the Weapons tab.":"Hunter's Laird 350 عند تقاطع Grassrivers وأسلحة الـ Keys متاحة من البداية — شوف تبويب الأسلحة.","Start collecting cards":"ابدأ تجمع الكروت","Cards appear after Gone Fishing. Key Lento has several — search “Key Lento” in the Cards tab.":"الكروت تطلع بعد Gone Fishing. في Key Lento كذا كرت — اكتب «Key Lento» بالبحث في تبويب الكروت.","Race Against Yago ⚠️ TIMED":"Race Against Yago ⚠️ محدودة بوقت","A stranger mission with a time window — needed for Strangers & Freaks. Do it as soon as it appears.":"مهمة غرباء لها وقت محدد — ضرورية لـ Strangers & Freaks. سوّها أول ما تطلع.","Get the Key Cloner":"خذ جهاز Key Cloner","Clonin' Keys, Makin' GS (steal the Zorrusso for Randy) gives you the Key Cloner and Randy's Wish List.":"مهمة Clonin' Keys, Makin' GS (اسرق Zorrusso لـ Randy) تعطيك Key Cloner وقائمة Randy.","Randy's Wish List cars":"سيارات قائمة Randy","16–18 high-end cars, $30–35k each, one-time list. Deliver with zero damage. See Special cars.":"16–18 سيارة فخمة، 30–35 ألف$ للوحدة، القائمة مرة وحدة. سلّمها بدون خدش. شوف سيارات خاصة.","Register tracked cars at Pay 'n' Spray":"سجّل السيارات اللي فيها تراكر في Pay 'n' Spray","From early Chapter 3, Pay 'n' Spray registers cars with a Standard Tracker.":"من بداية الفصل 3، Pay 'n' Spray يسجّل السيارات اللي فيها Standard Tracker.","Bank the end-of-chapter payout":"خزّن فلوس نهاية الفصل","A story payout of about $120,000 is reported at the end of Chapter 3 — bank it.":"فيه مكافأة قصة حوالي 120,000$ بنهاية الفصل 3 حسب البلاغات — حطها بالبنك.","Manual save at the start":"حفظ يدوي بالبداية","Keep one untouched save per chapter.":"خلّ حفظ ما تلمسه لكل فصل.","Free garage: Thompson Court":"كراج مجاني: Thompson Court","Mission Company Cars gives you Thompson Court Garage (Ocean Beach).":"مهمة Company Cars تعطيك Thompson Court Garage (Ocean Beach).","Keep buying garages":"كمّل شراء الكراجات","Little Boxes needs all 8 purchasable garages — see the Garage tab.":"تروفي Little Boxes يحتاج الكراجات الـ 8 كلها — شوف تبويب الكراج.","Free garages: NE 15th Street & Pegassi Residences":"كراجات مجانية: NE 15th Street و Pegassi Residences","Operation Savage Glory gives you both.":"Operation Savage Glory تعطيك الاثنين.","Finish every character questline":"خلّص مهام كل الشخصيات","Andy, Kenton, Billy, Randy, Tyrone and Bret each have a trophy — finish them before the final mission.":"Andy و Kenton و Billy و Randy و Tyrone و Bret كل واحد له تروفي — خلّصهم قبل المهمة الأخيرة.","Save before the final mission":"احفظ قبل المهمة الأخيرة","Keep a save right before the last mission in case the ending locks a character.":"خلّ حفظ قبل آخر مهمة مباشرة لو النهاية قفلت شخصية.","Cheats unlock after the story":"الغشّات تنفتح بعد القصة","Cheats only work after the main story, each tied to a challenge — and you can't save with one active.":"الغشّات تشتغل بس بعد القصة، وكل وحدة مربوطة بتحدي — وما تقدر تحفظ وهي شغالة.","🏁 Chapter guide":"🏁 دليل الفصول","Which chapter are you on?":"أنت في أي فصل؟","Chapter":"الفصل","⚠️ Before you move on":"⚠️ قبل ما تكمل","✅ Chapter checklist":"✅ مهام الفصل","Pick your chapter above to see its warnings and checklist.":"اختار الفصل اللي وصلته فوق عشان يطلع لك تنبيهه ومهامه.","📷 and ▶️ open a photo / video search for the spot. 🗺️ opens the exact pin on GTABase.":"📷 و ▶️ تفتح بحث صور وفيديو للمكان. 🗺️ يفتح المكان بالضبط على GTABase.","Docks in the southeast of Belpoint island":"على الرصيف جنوب شرق جزيرة Belpoint","Southeast Belpoint burning-flamingo houses — in front of the big white house":"بيوت حرق الفلامنقو جنوب شرق Belpoint — قدام البيت الأبيض الكبير","Same burning-flamingo houses — corner of the small white house":"نفس بيوت حرق الفلامنقو — عند زاوية البيت الأبيض الصغير","Inside the burning flamingo container on the beach":"داخل حاوية الفلامنقو المحترقة على الشاطئ","Ground by the fire at the burning container, beside a corpse and a tipped-over camping chair":"على الأرض جنب النار عند الحاوية المحترقة، بجانب جثة وكرسي رحلات مقلوب","On the yellow container in the water by the burning container":"فوق الحاوية الصفراء بالماء جنب الحاوية المحترقة","Eastern edge of Watson Bay — southwest corner of a motel surrounded by trash":"الطرف الشرقي لـ Watson Bay — الزاوية الجنوبية الغربية لموتيل محاط بالزبالة","La Perle — ground level, centre of the C-shaped building northwest of Tyrone's apartment":"La Perle — الدور الأرضي، وسط المبنى اللي شكله C شمال غرب شقة Tyrone","Off Key Lento — logged during Island Dreams. 10 doubloons clear it from the map.":"قريب من Key Lento — ينحسب بمهمة Island Dreams. 10 دبلونات تشيله من الخريطة.","Sunken galleon south of Key Lento — 7 treasures (Dragon Pipe by the net, Purple Gemstone in a barrel).":"سفينة غارقة جنوب Key Lento — 7 كنوز (Dragon Pipe جنب الشبكة، Purple Gemstone ببرميل).","Seabed south of Key Lento and Abismo Key — 5 treasures incl. Golden Chalice.":"قاع البحر جنوب Key Lento و Abismo Key — 5 كنوز منها Golden Chalice.","Off southeast Key Lento near green islets — 6 treasures incl. Ancient Ceremonial Mask.":"جنوب شرق Key Lento قرب جزر خضراء — 6 كنوز منها Ancient Ceremonial Mask.","Same waters as Cinco Torres — dive both in one trip. 6 treasures incl. Golden Llama.":"نفس مياه Cinco Torres — غُص على الاثنين بمشوار واحد. 6 كنوز منها Golden Llama.","East of Key Lento — 6 treasures incl. Santa Sierra Bell and Brass Spyglass.":"شرق Key Lento — 6 كنوز منها Santa Sierra Bell و Brass Spyglass.","Story car — delivered automatically in Clonin' Keys, Makin' GS":"سيارة القصة — تنحسب تلقائياً بمهمة Clonin' Keys, Makin' GS","Level 7 of the Crosstown Police Station garage — sneak up":"الدور السابع بكراج مركز شرطة Crosstown — اطلع بالتسلل","Parked at the rich houses in Capri":"تكون واقفة عند البيوت الفخمة في Capri","NE 3rd Street tow-truck encounter (around 1 PM)":"حدث سحب السيارة في NE 3rd Street (حوالي 1 الظهر)","Inside a house":"داخل بيت","Shore Drive, Ocean Beach":"Shore Drive، Ocean Beach","Red shipping container in the M7 junkyard east of Boone Speedway, Hamlet":"حاوية حمراء بساحة خردة M7 شرق Boone Speedway، Hamlet","Rich houses — also the southernmost corner of Peacock Estates":"البيوت الفخمة — وفيه وحدة بأقصى جنوب Peacock Estates","Outside Sweetbay Inn, East Buckley Drive, Capri — around 3 AM":"قدام Sweetbay Inn، East Buckley Drive، Capri — حوالي 3 الفجر","Added later by the side mission ¡Dale Mamba!":"تنضاف بعدين بالمهمة الجانبية ¡Dale Mamba!","⌚ Luxury watches (34)":"⌚ الساعات الفاخرة (34)","Golden icon, usually inside gang operations. Count toward Discovered Styles (70 of 79 needed).":"أيقونة ذهبية، غالباً داخل عمليات العصابات. تنحسب ضمن Discovered Styles (تحتاج 70 من 79).","🎬 Video: all 34 watches":"🎬 فيديو: كل الـ 34 ساعة","📚 Magazines, books & comics (34)":"📚 المجلات والكتب والكوميكس (34)","27 items + 7 Book Swaps; 30 needed for 100%. Jason's house has 5 that disappear when Chapter 1 ends.":"27 + 7 Book Swaps؛ تحتاج 30. في بيت Jason خمسة تروح لما يخلص الفصل 1.","🎬 Video: all 34":"🎬 فيديو: كلها","🎬 Video: 5 in Jason's house (Ch.1)":"🎬 فيديو: الخمسة ببيت Jason (الفصل 1)","🎬 Video: 7 Book Swaps":"🎬 فيديو: 7 Book Swaps","🎵 Unique playlists":"🎵 قوائم الأغاني الفريدة","Scan the posters; 2 of 2 needed for 100%.":"امسح البوسترات؛ تحتاج 2 من 2.","🎬 Video: all playlist locations":"🎬 فيديو: كل الأماكن","🐾 Animals (100 of 255)":"🐾 الحيوانات (100 من 255)","Scan with WAiNK or the camera. Night/dawn and rain change what spawns; sea life needs a boat or diving gear.":"امسحها بالـ WAiNK أو الكاميرا. الليل والفجر والمطر يغيرون اللي يطلع؛ حيوانات البحر تحتاج قارب أو غوص.","🎬 Legendary animals":"🎬 الحيوانات الأسطورية","🎬 Rare animals":"🎬 الحيوانات النادرة","🎬 Every animal":"🎬 كل الحيوانات","Steal a Rhino tank from the south of Mile Zero Air Station (Mariana County) and shoot some enemies — you get 4 stars on entering":"اسرق دبابة Rhino من جنوب Mile Zero Air Station (ماريانا) واضرب كم عدو — يطلع لك 4 نجوم أول ما تركب","Max the Strength stat for both Jason and Lucia (train at gyms together)":"وصّل   Object.keys(WAINK).forEach(function(g,gi){var arr=WAINK[g],d=arr.filter(function(w,i){return isOn("w"+gi+"_"+i)}).length;h+='<details class="box" data-g="wink'+gi+'"'+(filt.open&&filt.open["wink"+gi]?' open':'')+'><summary>'+g+' <span class="tag">'+d+' / '+arr.length+' known</span></summary>'+(WVID[gi]?'<div class="links"><a target="_blank" rel="noopener" href="'+WVID[gi]+'">🎬 Video: all of them</a></div>':(gi===3?'<div class="links">'+lk("🎬 Video: all No Flusher tags","https://youtu.be/mM8RsaIBo1k?t=1165")+'</div><div class="d">Unlocked by a text from Cal. Hard-to-spot markings painted on the ground — scan with WAiNK; your controller pulses left/right when one is close. The progress menu only shows a total, not which ones.</div>':''))+arr.map(function(w,i){return row("w"+gi+"_"+i,esc(w[0]),'📍 '+esc(w[1])+' <span class="tag">'+R[w[2]].split(" (")[0]+'</span>',links(w[0],"WAiNK"))}).join("")+'</details>'});
  return h;
}
function vMed(){return '<div class="box tip"><div class="d">18 meditations at 10 spots. Most count twice (once as Jason, once as Lucia). 15 for 100%, all 18 for Positive Mental Attitude. Meditating raises Focus. Track: Progress › Collections › Exploration › Meditations.</div></div><div class="box">'+MED.map(function(m,i){return row("m"+i,esc(m[0])+' <span class="tag">×'+m[3]+'</span>'+(i===0?'<span class="tag m">Ch.1 only</span>':''),'📍 '+esc(m[1])+'<br>'+esc(m[4]),links(m[0],"meditation spot"))}).join("")+'</div>'}
function vTrophy(){
  var gn={P:"🏆 Platinum",G:"🥇 Gold",S:"🥈 Silver",B:"🥉 Bronze"};
  var h='<div class="box tip"><div class="d">55 trophies: 1 Platinum, 2 Gold, 6 Silver, 46 Bronze. Hidden (story) trophy descriptions are hidden to avoid spoilers — tap “Reveal” if you want.</div></div><div class="box">';
  TROPHIES.forEach(function(t,i){var desc=t[2]?'<button class="spoil" data-sp="'+i+'">🔒 Hidden — reveal</button><span id="sp'+i+'" style="display:none">'+esc(t[3])+'</span>':esc(t[3]);h+=row("t"+i,esc(t[0])+' <span class="tag'+(t[1]==="G"||t[1]==="P"?' g':t[1]==="S"?' s':' b')+'">'+gn[t[1]]+'</span>'+(t[4]?'<span class="tag p">Chapter 2</span>':''),desc)});
  return h+'</div>';
}
function vWeap(){
  var groups={"free":"🔫 Free legendary weapons (found in the world)","buy":"🛒 Legendary variants sold at Ammu-Nation","ultimate":"💎 Exclusive"};
  var h='<div class="box tip"><div class="d">• Unique weapons can\'t be modified (no scope, suppressor or extended mag).<br>• Once collected, a legendary weapon is usable by both Jason and Lucia.<br>• Store spares in your personal vehicle\'s trunk.</div></div>';
  Object.keys(groups).forEach(function(g){h+='<div class="box"><h2>'+groups[g]+'</h2>'+WEAP.map(function(w,i){return w[4]!==g?"":row("g"+i,esc(w[0]),'📍 '+esc(w[1])+'<br>'+esc(w[2]),g==="ultimate"?"":links(w[0],"weapon"))}).join("")+'</div>'});
  return h;
}
function vCars(){return '<div class="box tip"><div class="d">There\'s no in-game list called “Exotic” — the closest is <b>Randy\'s Wish List</b> of high-end cars plus hidden unique cars. Not all Wish List models have been revealed yet.<br>🏆 Related trophies: Whip It Good (discover 100 vehicles), On the Spot (register 10 to Scooter Bros), Little Boxes (all garages), Capital Offense (smash out of a showroom), Supply & Demand (Randy\'s last mission).<br>👉 See the <b>Garage & all cars</b> tab for how to keep cars forever.</div></div><div class="box">'+CARS.map(function(c,i){return row("v"+i,esc(c[0]),'📍 '+esc(c[1])+'<br>'+esc(c[2]),links(c[0].split(" (")[0]))}).join("")+'</div>'+dsec("randy",'🏎️ '+esc(T("Randy's Wish List — all 22"))+' <span class="tag">'+XD.RANDY.filter(function(x,i){return isOn("r"+i)}).length+' / '+XD.RANDY.length+'</span>','<div class="d">'+esc(T("Opens in Chapter 3. Every car has an Advanced Tracker — keep moving and deliver to Randy in Balsero without a scratch. Track them in Map › Robberies › Randy's Wish List."))+'</div><div class="links">'+lk("🎬 Video: all Wish List cars","https://youtu.be/5R-JU8o5IWw")+lk("🎬 Video 2","https://youtu.be/4AZLBK4RtDE")+'</div>'+XD.RANDY.map(function(x,i){return row("r"+i,esc(x[0]),'📍 '+esc(x[1])+(x[2]?' — '+esc(T(x[2])):''),links(x[0],"Randy wish list"))}).join(""))+dsec("moses",'🚚 '+esc(T("Moses drop-offs — all 7"))+' <span class="tag">'+XD.MOSES.filter(function(x,i){return isOn("o"+i)}).length+' / 7</span>','<div class="links">'+lk("🎬 Video: all Moses vehicles","https://youtu.be/UyxxY0A_kow")+'</div>'+XD.MOSES.map(function(x,i){return row("o"+i,esc(x[0]),'📍 '+esc(x[1]),links(x[0],"Moses"))}).join(""))}
function vGarage(){
  var h='<div class="box warn"><h2>🔒 How to keep a car forever</h2><div class="d" style="color:#f3d6e4">You <b>can\'t buy cars</b> in GTA 6 — you steal them and <b>register</b> them. Unregistered cars vanish when you leave them, however carefully you park. Every registered car needs its own garage slot.</div></div>';
  h+='<div class="box"><h2>🧭 What you can do by chapter</h2><table>'+KEEP.map(function(k){return '<tr><td><b>'+k[0]+'</b></td><td class="d">'+esc(k[1])+'</td></tr>'}).join("")+'</table></div>';
  h+='<div class="box"><h2>🛠️ Steal → register → park</h2><ol class="d" style="padding-left:20px;margin:0">'+KEEPSTEPS.map(function(s){return '<li style="margin-bottom:6px">'+esc(s)+'</li>'}).join("")+'</ol><div class="d" style="margin-top:8px">🚨 Trackers: <b>Standard</b> = police can trace the plate; register at Pay \'n\' Spray (Ch.3). <b>Advanced</b> (red icon bottom-left) = reports you to police when you drive slowly — keep moving; removal later via Randy.</div></div>';
  var tot=0;GARAGES.forEach(function(g){var n=parseInt(String(g[2]).replace(/[^0-9]/g,""));if(n)tot+=n});
  h+='<div class="box"><h2>🅿️ Expand your garage — every garage <span class="tag">'+cnt("x")[0]+' / '+GARAGES.length+'</span></h2><div class="d">Max in the standard game: <b>18 cars</b> (2 outside spots + 16 garage spots). The 8 purchasable garages total <b>$'+tot.toLocaleString()+'</b> and owning all 8 unlocks <b>Little Boxes</b>. Four story garages are free. Garage capacity can\'t be upgraded — you only expand by owning more garages.</div>'+GARAGES.map(function(g,i){return row("x"+i,esc(g[0])+' <span class="tag'+(g[2]==="Free"?' p':' g')+'">'+esc(g[2])+'</span>','📍 '+esc(g[1])+'<br>🔓 '+esc(g[4])+' · '+esc(g[3]),links(g[0],"garage"))}).join("")+'</div>';
  var classes=[];CATALOG.forEach(function(c){if(classes.indexOf(c[0])<0)classes.push(c[0])});
  h+='<div class="box"><h2>🚗 Every car documented so far <span class="tag">'+cnt("k")[0]+' / '+CATALOG.length+' registered</span></h2><div class="d">Tick a car when you\'ve <b>registered</b> it. Spawn areas come from community tracking; “Not documented” means no guide has a spot yet. The game has ~300 vehicles in total; this list grows as spots are found.</div>';
  classes.forEach(function(cl){h+='<h3>'+cl+'</h3>'+CATALOG.map(function(c,i){return c[0]!==cl?"":row("k"+i,esc(c[1]),'Real-world: '+esc(c[2])+' · 📍 '+esc(c[3]),links(c[1],"car"))}).join("")});
  return h+'</div>';
}
function vFull(){
  var h='<div class="box tip"><div class="d">Everything else GTABase has pinned that isn\'t already in the other tabs — names only, each with a link straight to its pin on their map. Tick as you go. Sections are collapsed; tap to open.</div></div><div class="tools"><input type="search" id="fq" placeholder="Search…" value="'+esc(filt.fq||"")+'"><button class="chip'+(filt.hide?' on':'')+'" id="ch">'+(filt.hide?'👁️ Show done':'🙈 Hide done')+'</button></div>';
  var fq=(filt.fq||"").toLowerCase();
  FULL.forEach(function(g){var all=[];g[1].forEach(function(c){all=all.concat(c[1])});var d=all.filter(function(it){return isOn("z"+it[0])}).length;
    var inner=g[1].map(function(c){var items=c[1].filter(function(it){if(filt.hide&&isOn("z"+it[0]))return false;if(fq&&(it[1]+" "+c[0]).toLowerCase().indexOf(fq)<0)return false;return true});if(!items.length)return"";var dd=c[1].filter(function(it){return isOn("z"+it[0])}).length;
      return '<h3>'+esc(c[0])+' <span class="tag">'+dd+' / '+c[1].length+'</span></h3>'+items.map(function(it){return row("z"+it[0],esc(it[1]),"",'<div class="links"><a target="_blank" rel="noopener" href="https://www.gtabase.com/gta-6/map/#'+it[0]+'">🗺️ GTABase exact pin</a><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+q("GTA 6 "+it[1]+" location")+'">▶️ Video</a></div>')}).join("")}).join("");
    if(!all.length||(!inner&&(fq||filt.hide)))return;
    h+='<details class="box"'+(fq?' open':'')+' data-g="'+esc(g[0])+'"'+(filt.open&&filt.open[g[0]]?' open':'')+'><summary>'+g[0]+' <span class="tag">'+d+' / '+all.length+'</span></summary>'+inner+'</details>'});
  return h;
}
function lk(lab,url){return '<a target="_blank" rel="noopener" href="'+url+'">'+esc(T(lab))+'</a>'}
function dsec(id,title,inner){return '<details class="box" data-g="'+id+'"'+(filt.open&&filt.open[id]?' open':'')+'><summary>'+title+'</summary>'+inner+'</details>'}
function vMore(){
  var h='<div class="box tip"><div class="d">'+esc(T("Everything else the 100% checklist asks for. Exact spots are in the videos — each one is a full walkthrough."))+'</div></div>';
  var fd=XD.FLAM.filter(function(x,i){return isOn("f"+i)}).length;
  h+=dsec("flam",'🦩 Cocaine Flamingos <span class="tag">'+fd+' / '+XD.FLAM.length+' known · 125</span>','<div class="d">'+esc(T("125 in the game, 100 needed. Only the black-and-white-beak ones count — shoot them; 50 unlocks the Inflatable Flamingo cheat."))+'</div><div class="links">'+lk("🎬 Video: all 125","https://youtu.be/tzCkxqF9tI0")+lk("🎬 Video: first 17 in Mariana County","https://youtu.be/mZ8IdeSzZUU")+lk("🎬 Video: Mile Zero Air Station","https://youtu.be/iCG3Rb97SnU")+'</div>'+XD.FLAM.map(function(x,i){return row("f"+i,"🦩 "+esc(x[1]),esc(T(x[0])),links("cocaine flamingo "+x[1]))}).join(""));
  var sd=XD.WRECK.filter(function(x,i){return isOn("s"+i)}).length;
  h+=dsec("wreck",'🌊 '+esc(T("Kenton's shipwrecks"))+' <span class="tag">'+sd+' / '+XD.WRECK.length+'</span>','<div class="d">'+esc(T("33 Underwater Discoveries needed for 100%. Finish Island Dreams, take any boat, sweep the metal detector until it flashes green, sell everything to Kenton."))+'</div><div class="links">'+lk("🎬 Video: every shipwreck treasure","https://youtu.be/8cgNlX0FP9Y")+'</div>'+XD.WRECK.map(function(x,i){return row("s"+i,"⚓ "+esc(x[0]),esc(T(x[1])),'<div class="links"><a target="_blank" rel="noopener" href="https://youtu.be/8cgNlX0FP9Y?t='+x[2]+'">'+esc(T("🎬 Jump to this wreck"))+'</a></div>')}).join(""));
  XD.MORE.forEach(function(m,mi){h+=dsec("more"+mi,esc(T(m[0])),'<div class="d">'+esc(T(m[1]))+'</div><div class="links">'+m[2].map(function(l){return lk(l[0],l[1])}).join("")+'</div>')});
  return h;
}
function vCodes(){return '<div class="box tip"><div class="d">Fixed codes (story & locations) work in every playthrough. Store and bank safe codes are <b>random</b> and change every robbery. Codes marked <b>*</b> (gang hideouts) may change between saves — if one fails, look for a note nearby.</div></div><div class="box"><table><tr><th>Code</th><th>Where</th><th>Note</th></tr>'+CODES.map(function(c,i){return '<tr><td><span class="code">'+esc(c[0])+'</span><div class="d">'+esc(c[3])+'</div></td><td>'+esc(c[1])+(GTLC[i]?'<div class="links"><a target="_blank" rel="noopener" href="https://www.gtabase.com/gta-6/map/'+(GTLC[i].charAt(0)==="?"?GTLC[i]:'#'+GTLC[i])+'">🗺️ GTABase '+(GTLC[i].charAt(0)==="?"?'all safes':'exact pin')+'</a></div>':'')+(CODEVID[i]?'<div class="links"><a target="_blank" rel="noopener" href="'+CODEVID[i]+'">🎬 Video guide</a></div>':'')+'</td><td class="d">'+esc(c[2])+'</td></tr>'}).join("")+'</table></div>'}
function vSum(){
  var parts=[["Chapter 2","h"],["Trophies","t"],["Known cards","c"],["Known WAiNK","w"],["Meditations","m"],["Weapons","g"],["Special cars","v"],["Garages","x"],["Cars registered","k"],["Full checklist","z"]];
  var h='<div class="grid">'+parts.map(function(p){var c=cnt(p[1]);return '<div class="stat"><div class="n">'+c[0]+'/'+c[1]+'</div><div class="l">'+p[0]+'</div></div>'}).join("")+'</div>';
  h+='<div class="box" style="margin-top:12px"><h2>📊 All collectibles in the game</h2><table><tr><th>Type</th><th>Total</th><th>For 100%</th><th>Note</th></tr>'+TOTALS.map(function(t){return '<tr><td><b>'+t[0]+'</b></td><td>'+t[1]+'</td><td>'+t[2]+'</td><td class="d">'+t[3]+'</td></tr>'}).join("")+'</table></div>';
  h+='<div class="box"><button class="chip" id="reset">🗑️ Reset all checkmarks</button><div id="rc" style="display:none;margin-top:8px"><span class="d">Are you sure? </span><button class="chip" id="rcy">Yes, reset</button> <button class="chip" id="rcn">No</button></div></div>';
  return h;
}
function render(){var v={ch2:vCh2,map:vMap,cards:vCards,wink:vWink,med:vMed,trophy:vTrophy,weap:vWeap,cars:vCars,garage:vGarage,more:vMore,full:vFull,codes:vCodes,sum:vSum}[cur];document.getElementById("view").innerHTML=v();TUI(document.getElementById("view"));renderHead();bindView()}
function bindView(){
  var cq=document.getElementById("cq");if(cq){cq.oninput=function(){filt.q=cq.value;var p=cq.selectionStart;render();var n=document.getElementById("cq");n.focus();try{n.setSelectionRange(p,p)}catch(e){}}}
  var fq=document.getElementById("fq");if(fq){fq.oninput=function(){filt.fq=fq.value;var p=fq.selectionStart;render();var n=document.getElementById("fq");n.focus();try{n.setSelectionRange(p,p)}catch(e){}}}
  document.querySelectorAll("details[data-g]").forEach(function(dt){dt.addEventListener("toggle",function(){filt.open=filt.open||{};filt.open[dt.getAttribute("data-g")]=dt.open})});
  var cr=document.getElementById("cr");if(cr)cr.onchange=function(){filt.region=cr.value;render()};
  var cs=document.getElementById("cs");if(cs)cs.onchange=function(){filt.set=cs.value;render()};
  var ch=document.getElementById("ch");if(ch)ch.onclick=function(){filt.hide=!filt.hide;render()};
  var rs=document.getElementById("reset");if(rs)rs.onclick=function(){document.getElementById("rc").style.display="block"};
  var ry=document.getElementById("rcy");if(ry)ry.onclick=function(){st.s={};st.t=Date.now();try{localStorage.setItem(SKEY,JSON.stringify(st))}catch(e){}schedulePub();render()};
  var rn=document.getElementById("rcn");if(rn)rn.onclick=function(){document.getElementById("rc").style.display="none"};
}
document.addEventListener("click",function(e){
  var cb=e.target.closest("[data-chap]");if(cb){CHAP=cb.getAttribute("data-chap");try{localStorage.setItem("gta6chap",CHAP)}catch(x){}render();return}
  var lb=e.target.closest("[data-lang]");if(lb){var L=lb.getAttribute("data-lang");try{localStorage.setItem("gta6lang",L)}catch(x){}window.name="gta6lang="+L;location.reload();return}
  var tb=e.target.closest("[data-tab]");if(tb){go(tb.getAttribute("data-tab"));return}if(e.target.closest("[data-sheet]")){document.getElementById("sheet").hidden=false;return}if(e.target.id==="sheet"){e.target.hidden=true;return}
  var gt=e.target.closest("[data-goto]");if(gt){e.preventDefault();gotoMap(gt.getAttribute("data-goto"));return}
  var tw=e.target.closest("[data-town]");if(tw){var t=tw.getAttribute("data-town");focus.town=focus.town===t?"":t;focus.item="";render();return}
  var kd=e.target.closest("[data-kind]");if(kd){var ic=kd.getAttribute("data-kind");focus.kinds[ic]=focus.kinds[ic]?0:1;render();return}
  if(e.target.id==="zout"){focus.town="";focus.item="";render();return}
  var sp=e.target.closest("[data-sp]");if(sp){e.preventDefault();sp.style.display="none";document.getElementById("sp"+sp.getAttribute("data-sp")).style.display="inline";return}
});
document.addEventListener("change",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(k&&e.target.type==="checkbox"){setK(k,e.target.checked);var r=e.target.closest(".row");if(r)r.classList.toggle("done",e.target.checked)}});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(h&&h!==cur&&TABS.some(function(t){return t[0]===h}))go(h)});
document.querySelectorAll('[data-lang]').forEach(function(b){if(b.getAttribute('data-lang')===LANG)b.classList.add('on')});TUI(document.querySelector('header h1'));TUI(document.querySelector('footer'));renderTabs();render();
})();

</script>
